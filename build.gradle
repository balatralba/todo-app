plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'org.example'
version = findProperty('version') ?: '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

application {
    mainClass = 'org.example.ToDoApp' // Исправлено: mainClassName -> application { mainClass }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set("todo-app")
    archiveClassifier.set("") // no classifier: produce todo-app-<version>.jar
    archiveVersion.set(project.version.toString())
    mergeServiceFiles()
}

tasks.jar {
    enabled = false
}

tasks.named("distZip") { Task it ->
    dependsOn tasks.named("shadowJar")
}

tasks.named("distTar") { Task it ->
    dependsOn tasks.named("shadowJar")
}

tasks.named("startScripts") { Task it ->
    dependsOn tasks.named("shadowJar")
}

tasks.named("startShadowScripts") {
    dependsOn tasks.named("shadowJar")
}

tasks.build {
    dependsOn shadowJar
}