plugins {
    id 'java'
    id 'maven-publish'
    id 'application'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'org.example'
version = findProperty('version') ?: '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

application {
    mainClass = 'org.example.ToDoApp'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set("todo-app")
    archiveClassifier.set("")
    archiveVersion.set(project.version.toString())
    mergeServiceFiles()
}

tasks.jar {
    enabled = false
}

tasks.named("distZip") { dependsOn tasks.named("shadowJar") }
tasks.named("distTar") { dependsOn tasks.named("shadowJar") }
tasks.named("startScripts") { dependsOn tasks.named("shadowJar") }
tasks.named("startShadowScripts") { dependsOn tasks.named("shadowJar") }
tasks.build { dependsOn shadowJar }

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'org.example'
            artifactId = 'todo-app'
            version = project.version

            artifact(tasks.shadowJar)
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            def githubRepo = System.getenv("GITHUB_REPOSITORY") ?: "balatralba/todo-app"
            url = uri("https://maven.pkg.github.com/${githubRepo}")

            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty('gpr.key') ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}